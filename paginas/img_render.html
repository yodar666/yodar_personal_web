<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="../recursos/rosa-neon-64x64(2).png">
<title>Flores neón</title>
<style>
  :root { color-scheme: dark; }
  html, body { min-height: 100%; margin: 0; }
  body {
    background: #101010; color: #e9e9e9;
    font-family: system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; padding: 16px; box-sizing: border-box;
  }
  #game { width: min(92vw, 62vh, 800px); aspect-ratio: 1; border-radius: 6px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
  select, #custom, button {
    background: #1b1b1b; color: inherit; border: 1px solid #ff3cac;
    border-radius: 6px; padding: 8px 12px; font: inherit;
  }
  #custom { width: 90px; }
  button { cursor: pointer; }
  button:hover, button:focus-visible { background: #ff3cac; color: #101010; outline: none; }
  #pickers { max-width: 640px; }
  #pickers label {
    display: flex; align-items: center; gap: 6px; font-size: 14px;
    background: #1b1b1b; border: 1px solid #333; border-radius: 6px; padding: 4px 8px;
  }
  input[type=color] { width: 34px; height: 28px; padding: 0; border: 0; background: none; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="controls">
    <label>Flor
      <select id="flower"></select>
    </label>
    <label>Resolución
      <select id="res">
        <option value="64">64 × 64</option>
        <option value="128">128 × 128</option>
        <option value="256">256 × 256</option>
        <option value="512">512 × 512</option>
        <option value="1024" selected>1024 × 1024</option>
        <option value="2048">2048 × 2048</option>
        <option value="4096">4096 × 4096</option>
        <option value="custom">Personalizada…</option>
      </select>
    </label>
    <input id="custom" type="number" min="16" max="8192" step="1" value="1500" hidden aria-label="Lado en píxeles">
    <button id="pause">Pausar</button>
    <button id="save">Guardar PNG</button>
  </div>
  <div class="controls" id="pickers" aria-label="Colores de cada línea"></div>
  <button id="reset">Restablecer colores</button>
<script src="/js/img_render.js"></script>
</body>
</html>
